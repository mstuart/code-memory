name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Initialize test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d test_db <<'SQL'
          CREATE TABLE workspace_members (
            team_id TEXT NOT NULL,
            user_id TEXT NOT NULL,
            role TEXT NOT NULL,
            joined_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          CREATE TABLE knowledge_base (
            id TEXT PRIMARY KEY DEFAULT md5(random()::text || clock_timestamp()::text),
            team_id TEXT NOT NULL,
            file_path TEXT NOT NULL,
            content_hash TEXT NOT NULL,
            embedding REAL[],
            metadata JSONB,
            user_id TEXT,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          CREATE TABLE pending_knowledge (
            id TEXT PRIMARY KEY DEFAULT md5(random()::text || clock_timestamp()::text),
            file_path TEXT NOT NULL,
            content_hash TEXT NOT NULL,
            submitted_by TEXT NOT NULL,
            team_id TEXT NOT NULL,
            status TEXT NOT NULL,
            reviewed_by TEXT,
            reviewed_at TIMESTAMPTZ,
            rejection_reason TEXT,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          SQL
      - run: cargo fmt --package code-memory -- --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test_db

  ultracite:
    name: Ultracite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Install Node.js dependencies
        working-directory: npm
        run: npm install --ignore-scripts
      - name: Ultracite check
        working-directory: npm
        run: npm run check
  npm-package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: cargo build --release
      - run: |
          cp target/release/code-memory npm/bin/code-memory-bin
          chmod +x npm/bin/code-memory-bin
          cd npm
          npm pack --dry-run
          node bin/code-memory --version
